<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scientific Calculator</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --display-bg: #090d16;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --btn-num: #334155;
        --btn-num-hover: #475569;
        --btn-op: #0284c7;
        --btn-op-hover: #0369a1;
        --btn-func: #475569;
        --btn-func-hover: #64748b;
        --btn-action: #e11d48;
        --btn-action-hover: #be123c;
        --btn-equal: #16a34a;
        --btn-equal-hover: #15803d;
        --accent: #38bdf8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .calculator-container {
        background-color: var(--card-bg);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 440px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      .mode-toggle {
        background: #0f172a;
        border: 1px solid #334155;
        color: var(--accent);
        padding: 4px 10px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        transition: background-color 0.15s ease;
      }

      .display-container {
        background-color: var(--display-bg);
        border-radius: 12px;
        padding: 16px;
        text-align: right;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 120px;
        border: 1px solid #334155;
        overflow: hidden;
        position: relative;
      }

      .history {
        color: var(--text-muted);
        font-size: 0.9rem;
        height: 20px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .current-input {
        color: var(--text-main);
        font-weight: 600;
        line-height: 1.2;
        word-break: break-all;
        overflow-wrap: break-word;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        height: 70px;
        width: 100%;
        overflow: hidden;
        will-change: font-size;
      }

      .current-input span {
        display: inline-block;
        white-space: pre-wrap;
        text-align: right;
        width: 100%;
      }

      @keyframes staticGlitch {
        0% {
          transform: translate(0, 0);
          filter: drop-shadow(0 0 2px #facc15);
        }
        20% {
          transform: translate(-3px, 2px);
          filter: drop-shadow(0 0 8px #fef08a);
          color: #facc15;
        }
        40% {
          transform: translate(3px, -2px);
          filter: drop-shadow(0 0 4px #ffffff);
        }
        60% {
          transform: translate(-2px, -1px);
          filter: drop-shadow(0 0 10px #facc15);
          color: #fef08a;
        }
        80% {
          transform: translate(2px, 3px);
          filter: drop-shadow(0 0 5px #ffffff);
        }
        100% {
          transform: translate(0, 0);
          filter: drop-shadow(0 0 2px #facc15);
        }
      }

      .zap-glitch {
        animation: staticGlitch 0.1s ease infinite;
      }

      .buttons-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 14px 8px;
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text-main);
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          transform 0.05s ease;
        user-select: none;
        touch-action: manipulation;
      }

      button:active {
        transform: scale(0.96);
      }

      .btn-num {
        background-color: var(--btn-num);
      }
      .btn-num:hover {
        background-color: var(--btn-num-hover);
      }
      .btn-op {
        background-color: var(--btn-op);
      }
      .btn-op:hover {
        background-color: var(--btn-op-hover);
      }
      .btn-func {
        background-color: var(--btn-func);
        font-size: 0.95rem;
      }
      .btn-func:hover {
        background-color: var(--btn-func-hover);
      }
      .btn-action {
        background-color: var(--btn-action);
      }
      .btn-action:hover {
        background-color: var(--btn-action-hover);
      }
      .btn-equal {
        background-color: var(--btn-equal);
        grid-column: span 2;
      }
      .btn-equal:hover {
        background-color: var(--btn-equal-hover);
      }

      .footer-bar {
        display: flex;
        justify-content: flex-start;
        margin-top: -4px;
      }

      .update-log-btn {
        background: transparent;
        border: 1px solid #334155;
        color: var(--text-muted);
        font-size: 0.75rem;
        padding: 4px 8px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .update-log-btn:hover {
        background-color: #334155;
        color: var(--text-main);
      }
    </style>
  </head>

  <body>
    <div class="calculator-container">
      <div class="top-bar">
        <span>Scientific Calculator</span>
        <button class="mode-toggle" id="degRadBtn">DEG</button>
      </div>

      <div class="display-container" id="displayContainer">
        <div class="history" id="historyDisplay"></div>
        <div class="current-input"><span id="mainDisplay">0</span></div>
      </div>

      <div class="buttons-grid">
        <button class="btn-func" onclick="appendFunc('sin')">sin</button>
        <button class="btn-func" onclick="appendFunc('cos')">cos</button>
        <button class="btn-func" onclick="appendFunc('tan')">tan</button>
        <button class="btn-action" onclick="clearAll()">AC</button>
        <button class="btn-action" onclick="deleteChar()">DEL</button>

        <button class="btn-func" onclick="appendFunc('sqrt')">√</button>
        <button class="btn-func" onclick="appendOp('^')">^</button>
        <button class="btn-func" onclick="appendFunc('log')">log</button>
        <button class="btn-func" onclick="appendValue('(')">(</button>
        <button class="btn-func" onclick="appendValue(')')">)</button>

        <button class="btn-func" onclick="appendValue('π')">π</button>
        <button class="btn-num" onclick="appendValue('7')">7</button>
        <button class="btn-num" onclick="appendValue('8')">8</button>
        <button class="btn-num" onclick="appendValue('9')">9</button>
        <button class="btn-op" onclick="appendOp('+')">+</button>

        <button class="btn-func" onclick="appendValue('e')">e</button>
        <button class="btn-num" onclick="appendValue('4')">4</button>
        <button class="btn-num" onclick="appendValue('5')">5</button>
        <button class="btn-num" onclick="appendValue('6')">6</button>
        <button class="btn-op" onclick="appendOp('×')">×</button>

        <button class="btn-func" onclick="appendFunc('ln')">ln</button>
        <button class="btn-num" onclick="appendValue('1')">1</button>
        <button class="btn-num" onclick="appendValue('2')">2</button>
        <button class="btn-num" onclick="appendValue('3')">3</button>
        <button class="btn-op" onclick="appendOp('-')">-</button>

        <button class="btn-num" onclick="appendValue('.')">.</button>
        <button class="btn-num" onclick="appendValue('0')">0</button>
        <button class="btn-op" onclick="appendOp('÷')">÷</button>
        <button class="btn-equal" onclick="calculate()">=</button>
      </div>

      <div class="footer-bar">
        <button class="update-log-btn" onclick="openUpdateLog()">
          Update Log
        </button>
      </div>
    </div>

    <script>
      const clickSound = new Audio("ClickSound.mp3");
      const equalSound = new Audio("EqualSound.mp3");
      const fahhSound = new Audio("FahhSound.mp3");
      const mathsEditSound = new Audio("MathsEditSound.mp3");
      const zapSound = new Audio("ZapSound.mp3");
      mathsEditSound.volume = 1.0;
      zapSound.volume = 1.0;

      let isSoundLocked = false;
      let audioCtx = null;

      function resetAllButtonColors() {
        document.querySelectorAll(".buttons-grid button").forEach((b) => {
          b.style.backgroundColor = "";
        });
        degRadBtn.style.backgroundColor = "";
      }

      mathsEditSound.onended = () => {
        isSoundLocked = false;
        resetAllButtonColors();
      };

      zapSound.onended = () => {
        isSoundLocked = false;
        resetAllButtonColors();
        mainDisplay.classList.remove("zap-glitch");
      };

      function playFahhLoud() {
        if (isSoundLocked) return;
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const source = audioCtx.createMediaElementSource(fahhSound);
          let fahhGain = audioCtx.createGain();
          fahhGain.gain.value = 3.0;
          source.connect(fahhGain);
          fahhGain.connect(audioCtx.destination);
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        fahhSound.currentTime = 0;
        fahhSound.play().catch((err) => console.log("Audio play error:", err));
      }

      function openUpdateLog() {
        if (isSoundLocked) return;
        equalSound.currentTime = 0;
        equalSound.play().catch((err) => console.log("Audio play error:", err));
        window.open("changelog.html", "_blank");
      }

      let mainDisplay = document.getElementById("mainDisplay");
      let historyDisplay = document.getElementById("historyDisplay");
      let degRadBtn = document.getElementById("degRadBtn");

      let currentInput = "0";
      let history = "";
      let isDeg = true;
      let shouldResetDisplay = false;
      let renderScheduled = false;

      degRadBtn.addEventListener("click", () => {
        const isMathsEditPlaying =
          !mathsEditSound.paused &&
          mathsEditSound.currentTime > 0 &&
          !mathsEditSound.ended;
        const isZapPlaying =
          !zapSound.paused && zapSound.currentTime > 0 && !zapSound.ended;
        if (isMathsEditPlaying || isZapPlaying) {
          degRadBtn.style.backgroundColor = "#ef4444";
        }
        if (isSoundLocked) return;
        isDeg = !isDeg;
        degRadBtn.textContent = isDeg ? "DEG" : "RAD";
      });

      function triggerButtonVisuals(btn) {
        if (!btn) return;
        btn.style.transform = "scale(0.96)";
        setTimeout(() => {
          btn.style.transform = "";
        }, 100);

        const isMathsEditPlaying =
          !mathsEditSound.paused &&
          mathsEditSound.currentTime > 0 &&
          !mathsEditSound.ended;
        const isZapPlaying =
          !zapSound.paused && zapSound.currentTime > 0 && !zapSound.ended;
        if (isMathsEditPlaying || isZapPlaying) {
          btn.style.backgroundColor = "#ef4444";
        }
      }

      function findButtonByKey(key) {
        const buttons = document.querySelectorAll(".buttons-grid button");
        for (let btn of buttons) {
          let text = btn.textContent.trim();
          if ((key === "Enter" || key === "=") && text === "=") return btn;
          if ((key === "*" || key === "x" || key === "X") && text === "×")
            return btn;
          if (key === "/" && text === "÷") return btn;
          if (key === "Backspace" && text === "DEL") return btn;
          if (key === "Escape" && text === "AC") return btn;
          if (text === key) return btn;
        }
        return null;
      }

      document.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn || btn.classList.contains("update-log-btn")) return;

        triggerButtonVisuals(btn);

        if (isSoundLocked) return;

        if (btn.classList.contains("btn-equal")) {
          equalSound.currentTime = 0;
          equalSound.play().catch(() => {});
        } else if (!btn.classList.contains("btn-num")) {
          clickSound.currentTime = 0;
          clickSound.play().catch(() => {});
        }
      });

      function adjustFontSize() {
        let fontSize = 2.2;
        mainDisplay.style.fontSize = fontSize + "rem";
        while (mainDisplay.scrollHeight > 70 && fontSize > 0.7) {
          fontSize -= 0.1;
          mainDisplay.style.fontSize = fontSize + "rem";
        }
      }

      function updateDisplay() {
        if (renderScheduled) return;
        renderScheduled = true;
        requestAnimationFrame(() => {
          if (
            currentInput.includes("U.S. POLO") ||
            currentInput.includes("TERMINAL") ||
            currentInput.includes("ZAP")
          ) {
            mainDisplay.innerHTML = currentInput;
          } else {
            mainDisplay.textContent = currentInput;
          }
          historyDisplay.textContent = history;
          adjustFontSize();
          renderScheduled = false;
        });
      }

      function appendValue(val) {
        if (isSoundLocked) return;
        let parts = currentInput.split(/[\+\-\×\÷\^]/);
        let currentNumber = parts[parts.length - 1];
        if (currentNumber.length >= 60 && !shouldResetDisplay) return;

        if (val >= "0" && val <= "9") {
          clickSound.currentTime = 0;
          clickSound.play().catch(() => {});
        }

        if (currentInput === "0" || shouldResetDisplay) {
          currentInput = val;
          shouldResetDisplay = false;
        } else {
          currentInput += val;
        }
        updateDisplay();
      }

      function appendOp(op) {
        if (isSoundLocked) return;
        if (currentInput.length >= 60 && !shouldResetDisplay) return;
        if (shouldResetDisplay) shouldResetDisplay = false;
        const lastChar = currentInput.slice(-1);
        if (["+", "-", "×", "÷", "^"].includes(lastChar)) {
          currentInput = currentInput.slice(0, -1) + op;
        } else {
          currentInput += op;
        }
        updateDisplay();
      }

      function appendFunc(func) {
        if (isSoundLocked) return;
        if (currentInput.length + func.length + 1 >= 60 && !shouldResetDisplay)
          return;
        if (currentInput === "0" || shouldResetDisplay) {
          currentInput = func + "(";
          shouldResetDisplay = false;
        } else {
          currentInput += func + "(";
        }
        updateDisplay();
      }

      function clearAll() {
        if (isSoundLocked) return;
        currentInput = "0";
        history = "";
        shouldResetDisplay = false;
        mainDisplay.classList.remove("zap-glitch");
        updateDisplay();
      }

      function deleteChar() {
        if (isSoundLocked) return;
        if (shouldResetDisplay) {
          clearAll();
          return;
        }
        if (currentInput.length === 1) {
          currentInput = "0";
        } else {
          currentInput = currentInput.slice(0, -1);
        }
        updateDisplay();
      }

      function calculate() {
        if (isSoundLocked) return;
        try {
          let rawExpression = currentInput;
          history = currentInput + " =";

          let normalizedExpr = rawExpression
            .replace(/\s+/g, "")
            .replace(/×/g, "*")
            .replace(/÷/g, "/");

          if (normalizedExpr === "67+69+420*17/9") {
            let calcResult =
              Math.round((67 + 69 + (420 * 17) / 9) * 1e10) / 1e10;
            currentInput = `<span style="font-family: 'Georgia', serif; font-weight: bold; font-style: italic; letter-spacing: 1px; color: #f43f5e;">U.S. POLO (${calcResult})</span>`;
            shouldResetDisplay = true;
            updateDisplay();
            return;
          }

          if (normalizedExpr === "e^pi-pi" || normalizedExpr === "e^π-π") {
            let calcResult =
              Math.round((Math.E ** Math.PI - Math.PI) * 1e10) / 1e10;
            currentInput = `<span style="font-family: monospace; font-weight: bold; color: #22c55e; text-shadow: 0 0 10px rgba(34,197,94,0.6);">TERMINAL: ${calcResult}</span>`;
            shouldResetDisplay = true;
            updateDisplay();
            return;
          }

          if (
            normalizedExpr === "1/0.00000001" ||
            normalizedExpr === "1/1e-8"
          ) {
            currentInput = `<span style="color: #facc15; font-weight: bold; text-shadow: 0 0 8px #fef08a;">⚡ ZAP! 100,000,000</span>`;
            isSoundLocked = true;
            mainDisplay.classList.add("zap-glitch");
            zapSound.currentTime = 0;
            zapSound.play().catch(() => {
              isSoundLocked = false;
              mainDisplay.classList.remove("zap-glitch");
            });
            shouldResetDisplay = true;
            updateDisplay();
            return;
          }

          let expression = rawExpression
            .replace(/π/g, "Math.PI")
            .replace(/e/g, "Math.E")
            .replace(/×/g, "*")
            .replace(/÷/g, "/")
            .replace(/\^/g, "**");

          const angleMultiplier = isDeg ? "(Math.PI/180)*" : "";
          expression = expression.replace(
            /sin\(([^)]+)\)/g,
            (m, p1) => `Math.sin(${angleMultiplier}${p1})`,
          );
          expression = expression.replace(
            /cos\(([^)]+)\)/g,
            (m, p1) => `Math.cos(${angleMultiplier}${p1})`,
          );
          expression = expression.replace(
            /tan\(([^)]+)\)/g,
            (m, p1) => `Math.tan(${angleMultiplier}${p1})`,
          );
          expression = expression.replace(/sqrt\(([^)]+)\)/g, "Math.sqrt($1)");
          expression = expression.replace(/log\(([^)]+)\)/g, "Math.log10($1)");
          expression = expression.replace(/ln\(([^)]+)\)/g, "Math.log($1)");

          let result = Function('"use strict"; return (' + expression + ")")();

          if (typeof result === "number" && !isNaN(result)) {
            if (!isFinite(result)) {
              currentInput = result > 0 ? "Infinity" : "-Infinity";
              isSoundLocked = true;
              mathsEditSound.currentTime = 0;
              mathsEditSound.play().catch(() => {
                isSoundLocked = false;
              });
            } else {
              result = Math.round(result * 1e10) / 1e10;
              currentInput = result.toString();
            }
          } else {
            currentInput = "Error";
            playFahhLoud();
          }
        } catch (err) {
          currentInput = "Error";
          playFahhLoud();
        }

        shouldResetDisplay = true;
        updateDisplay();
      }

      document.addEventListener("keydown", (e) => {
        if (isSoundLocked) return;
        let matchedBtn = findButtonByKey(e.key);
        if (matchedBtn) {
          matchedBtn.click();
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
