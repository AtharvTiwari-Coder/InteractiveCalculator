<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scientific Calculator</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --display: #090d16;
        --text: #f8fafc;
        --muted: #94a3b8;
        --num: #334155;
        --op: #0284c7;
        --func: #475569;
        --action: #e11d48;
        --equal: #16a34a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 16px;
      }

      .calculator-container {
        background-color: var(--card);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .mode-toggle {
        background: #0f172a;
        border: 1px solid #334155;
        color: #38bdf8;
        padding: 4px 10px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
      }

      .display-container {
        background-color: var(--display);
        border-radius: 12px;
        padding: 14px;
        text-align: right;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 110px;
        border: 1px solid #334155;
        overflow: hidden;
      }

      .history {
        color: var(--muted);
        font-size: 0.85rem;
        height: 18px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .current-input {
        color: var(--text);
        font-weight: 600;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        height: 65px;
        width: 100%;
        overflow: hidden;
      }

      .current-input span {
        display: inline-block;
        white-space: pre-wrap;
        text-align: right;
        width: 100%;
      }

      @keyframes staticGlitch {
        0% {
          transform: translate(0, 0);
          filter: drop-shadow(0 0 2px #facc15);
        }
        50% {
          transform: translate(-2px, 2px);
          filter: drop-shadow(0 0 6px #fef08a);
          color: #facc15;
        }
        100% {
          transform: translate(0, 0);
          filter: drop-shadow(0 0 2px #facc15);
        }
      }

      .zap-glitch {
        animation: staticGlitch 0.1s ease infinite;
      }

      @keyframes hardGlitchVibrate {
        0% {
          transform: translate(0, 0) scale(1.02);
          background-color: #ef4444;
        }
        50% {
          transform: translate(2px, -2px) scale(1.03);
          background-color: #dc2626;
          box-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
        }
        100% {
          transform: translate(0, 0) scale(1.02);
          background-color: #ef4444;
        }
      }

      .red-vibrate {
        animation: hardGlitchVibrate 0.12s ease infinite;
      }

      .buttons-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 14px 6px;
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--text);
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
        transition: transform 0.05s ease;
      }

      button:active {
        transform: scale(0.95);
      }

      .btn-num {
        background-color: var(--num);
      }
      .btn-op {
        background-color: var(--op);
      }
      .btn-func {
        background-color: var(--func);
        font-size: 0.9rem;
      }
      .btn-action {
        background-color: var(--action);
      }
      .btn-equal {
        background-color: var(--equal);
        grid-column: span 2;
      }

      .footer-bar {
        display: flex;
        justify-content: flex-start;
      }

      .update-log-btn {
        background: transparent;
        border: 1px solid #334155;
        color: var(--muted);
        font-size: 0.75rem;
        padding: 4px 8px;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="calculator-container">
      <div class="top-bar">
        <span>Scientific Calculator</span>
        <button class="mode-toggle" id="degRadBtn">DEG</button>
      </div>

      <div class="display-container">
        <div class="history" id="historyDisplay"></div>
        <div class="current-input"><span id="mainDisplay">0</span></div>
      </div>

      <div class="buttons-grid">
        <button class="btn-func" onclick="appendFunc('sin')">sin</button>
        <button class="btn-func" onclick="appendFunc('cos')">cos</button>
        <button class="btn-func" onclick="appendFunc('tan')">tan</button>
        <button class="btn-action" onclick="clearAll()">AC</button>
        <button class="btn-action" onclick="deleteChar()">DEL</button>

        <button class="btn-func" onclick="appendFunc('sqrt')">√</button>
        <button class="btn-func" onclick="appendOp('^')">^</button>
        <button class="btn-func" onclick="appendFunc('log')">log</button>
        <button class="btn-func" onclick="appendValue('(')">(</button>
        <button class="btn-func" onclick="appendValue(')')">)</button>

        <button class="btn-func" onclick="appendValue('π')">π</button>
        <button class="btn-num" onclick="appendValue('7')">7</button>
        <button class="btn-num" onclick="appendValue('8')">8</button>
        <button class="btn-num" onclick="appendValue('9')">9</button>
        <button class="btn-op" onclick="appendOp('+')">+</button>

        <button class="btn-func" onclick="appendValue('e')">e</button>
        <button class="btn-num" onclick="appendValue('4')">4</button>
        <button class="btn-num" onclick="appendValue('5')">5</button>
        <button class="btn-num" onclick="appendValue('6')">6</button>
        <button class="btn-op" onclick="appendOp('×')">×</button>

        <button class="btn-func" onclick="appendFunc('ln')">ln</button>
        <button class="btn-num" onclick="appendValue('1')">1</button>
        <button class="btn-num" onclick="appendValue('2')">2</button>
        <button class="btn-num" onclick="appendValue('3')">3</button>
        <button class="btn-op" onclick="appendOp('-')">-</button>

        <button class="btn-num" onclick="appendValue('.')">.</button>
        <button class="btn-num" onclick="appendValue('0')">0</button>
        <button class="btn-op" onclick="appendOp('÷')">÷</button>
        <button class="btn-equal" onclick="calculate()">=</button>
      </div>

      <div class="footer-bar">
        <button
          class="update-log-btn"
          id="updateLogBtn"
          onclick="openUpdateLog()"
        >
          Update Log
        </button>
      </div>
    </div>

    <script>
      const clickSound = new Audio("ClickSound.mp3");
      const equalSound = new Audio("EqualSound.mp3");
      const fahhSound = new Audio("FahhSound.mp3");
      const mathsEditSound = new Audio("MathsEditSound.mp3");
      const zapSound = new Audio("ZapSound.mp3");

      let isSoundLocked = false;
      let audioCtx = null;
      let updateLogBtn = document.getElementById("updateLogBtn");
      let mainDisplay = document.getElementById("mainDisplay");
      let historyDisplay = document.getElementById("historyDisplay");
      let degRadBtn = document.getElementById("degRadBtn");

      let currentInput = "0";
      let history = "";
      let isDeg = true;
      let shouldResetDisplay = false;

      function resetAllButtonColors() {
        document.querySelectorAll(".buttons-grid button").forEach((b) => {
          b.style.backgroundColor = "";
          b.classList.remove("red-vibrate");
        });
        degRadBtn.style.backgroundColor = "";
        degRadBtn.classList.remove("red-vibrate");
        updateLogBtn.style.backgroundColor = "";
        updateLogBtn.classList.remove("red-vibrate");
      }

      mathsEditSound.onended = () => {
        isSoundLocked = false;
        resetAllButtonColors();
      };
      zapSound.onended = () => {
        isSoundLocked = false;
        resetAllButtonColors();
        mainDisplay.classList.remove("zap-glitch");
      };

      function playFahh() {
        if (isSoundLocked) return;
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          let src = audioCtx.createMediaElementSource(fahhSound);
          let gain = audioCtx.createGain();
          gain.gain.value = 3.0;
          src.connect(gain);
          gain.connect(audioCtx.destination);
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        fahhSound.currentTime = 0;
        fahhSound.play().catch(() => {});
      }

      function openUpdateLog() {
        if (isSoundLocked) return;
        equalSound.currentTime = 0;
        equalSound.play().catch(() => {});
        window.open("changelog.html", "_blank");
      }

      degRadBtn.addEventListener("click", () => {
        let isPlaying =
          (!mathsEditSound.paused &&
            mathsEditSound.currentTime > 0 &&
            !mathsEditSound.ended) ||
          (!zapSound.paused && zapSound.currentTime > 0 && !zapSound.ended);
        if (isPlaying) {
          degRadBtn.style.backgroundColor = "#ef4444";
          degRadBtn.classList.add("red-vibrate");
        }
        if (isSoundLocked) return;
        isDeg = !isDeg;
        degRadBtn.textContent = isDeg ? "DEG" : "RAD";
      });

      function triggerButtonVisuals(btn) {
        if (!btn) return;
        btn.style.transform = "scale(0.95)";
        setTimeout(() => {
          btn.style.transform = "";
        }, 80);

        let isPlaying =
          (!mathsEditSound.paused &&
            mathsEditSound.currentTime > 0 &&
            !mathsEditSound.ended) ||
          (!zapSound.paused && zapSound.currentTime > 0 && !zapSound.ended);
        if (isPlaying) {
          btn.style.backgroundColor = "#ef4444";
          btn.classList.add("red-vibrate");
        }
      }

      function findButtonByKey(key) {
        for (let btn of document.querySelectorAll(".buttons-grid button")) {
          let text = btn.textContent.trim();
          if ((key === "Enter" || key === "=") && text === "=") return btn;
          if ((key === "*" || key === "x") && text === "×") return btn;
          if ((key === "/" || key === "÷") && text === "÷") return btn;
          if (key === "+" && text === "+") return btn;
          if (key === "-" && text === "-") return btn;
          if (key === "Backspace" && text === "DEL") return btn;
          if (key === "Escape" && text === "AC") return btn;
          if (text === key) return btn;
        }
        return null;
      }

      document.addEventListener("click", (e) => {
        let btn = e.target.closest("button");
        if (!btn) return;
        triggerButtonVisuals(btn);
        if (btn.classList.contains("update-log-btn") || isSoundLocked) return;

        if (btn.classList.contains("btn-equal")) {
          equalSound.currentTime = 0;
          equalSound.play().catch(() => {});
        } else if (!btn.classList.contains("btn-num")) {
          clickSound.currentTime = 0;
          clickSound.play().catch(() => {});
        }
      });

      function adjustFontSize() {
        let size = 2.2;
        mainDisplay.style.fontSize = size + "rem";
        while (mainDisplay.scrollHeight > 65 && size > 0.7) {
          size -= 0.1;
          mainDisplay.style.fontSize = size + "rem";
        }
      }

      function updateDisplay() {
        requestAnimationFrame(() => {
          if (
            currentInput.includes("U.S. POLO") ||
            currentInput.includes("ZAP")
          ) {
            mainDisplay.innerHTML = currentInput;
          } else {
            mainDisplay.textContent = currentInput;
          }
          historyDisplay.textContent = history;
          adjustFontSize();
        });
      }

      function appendValue(val) {
        if (isSoundLocked) return;
        let parts = currentInput.split(/[\+\-\×\÷\^]/);
        if (parts[parts.length - 1].length >= 16 && !shouldResetDisplay) return;

        if (val >= "0" && val <= "9") {
          clickSound.currentTime = 0;
          clickSound.play().catch(() => {});
        }

        if (currentInput === "0" || shouldResetDisplay) {
          currentInput = val;
          shouldResetDisplay = false;
        } else {
          currentInput += val;
        }
        updateDisplay();
      }

      function appendOp(op) {
        if (isSoundLocked || (currentInput.length >= 16 && !shouldResetDisplay))
          return;
        if (shouldResetDisplay) shouldResetDisplay = false;
        let last = currentInput.slice(-1);
        if (["+", "-", "×", "÷", "^"].includes(last)) {
          currentInput = currentInput.slice(0, -1) + op;
        } else {
          currentInput += op;
        }
        updateDisplay();
      }

      function appendFunc(func) {
        if (isSoundLocked || (currentInput.length >= 16 && !shouldResetDisplay))
          return;
        if (currentInput === "0" || shouldResetDisplay) {
          currentInput = func + "(";
          shouldResetDisplay = false;
        } else {
          currentInput += func + "(";
        }
        updateDisplay();
      }

      function clearAll() {
        if (isSoundLocked) return;
        currentInput = "0";
        history = "";
        shouldResetDisplay = false;
        mainDisplay.classList.remove("zap-glitch");
        updateDisplay();
      }

      function deleteChar() {
        if (isSoundLocked) return;
        if (shouldResetDisplay) {
          clearAll();
          return;
        }
        currentInput =
          currentInput.length === 1 ? "0" : currentInput.slice(0, -1);
        updateDisplay();
      }

      function calculate() {
        if (isSoundLocked) return;
        if (shouldResetDisplay) {
          clearAll();
          return;
        }

        try {
          let raw = currentInput;
          history = raw + " =";
          let norm = raw
            .replace(/\s+/g, "")
            .replace(/×/g, "*")
            .replace(/÷/g, "/");

          if (norm === "67+69+420*17/9") {
            let res = Math.round((67 + 69 + (420 * 17) / 9) * 1e10) / 1e10;
            currentInput = `<span style="font-family:'Georgia',serif;font-weight:bold;font-style:italic;color:#f43f5e;">U.S. POLO (${res})</span>`;
            shouldResetDisplay = true;
            updateDisplay();
            return;
          }

          if (norm === "1/0.00000001" || norm === "1/1e-8") {
            currentInput = `<span style="color:#facc15;font-weight:bold;text-shadow:0 0 8px #fef08a;">⚡ ZAP! 100,000,000</span>`;
            isSoundLocked = true;
            mainDisplay.classList.add("zap-glitch");
            zapSound.currentTime = 0;
            zapSound.play().catch(() => {
              isSoundLocked = false;
              mainDisplay.classList.remove("zap-glitch");
            });
            shouldResetDisplay = true;
            updateDisplay();
            return;
          }

          let expr = raw
            .replace(/π/g, "Math.PI")
            .replace(/e/g, "Math.E")
            .replace(/×/g, "*")
            .replace(/÷/g, "/")
            .replace(/\^/g, "**");
          let am = isDeg ? "(Math.PI/180)*" : "";
          expr = expr.replace(
            /sin\(([^)]+)\)/g,
            (m, p) => `Math.sin(${am}${p})`,
          );
          expr = expr.replace(
            /cos\(([^)]+)\)/g,
            (m, p) => `Math.cos(${am}${p})`,
          );
          expr = expr.replace(
            /tan\(([^)]+)\)/g,
            (m, p) => `Math.tan(${am}${p})`,
          );
          expr = expr.replace(/sqrt\(([^)]+)\)/g, "Math.sqrt($1)");
          expr = expr.replace(/log\(([^)]+)\)/g, "Math.log10($1)");
          expr = expr.replace(/ln\(([^)]+)\)/g, "Math.log($1)");

          let res = Function('"use strict"; return (' + expr + ")")();

          if (typeof res === "number" && !isNaN(res)) {
            if (!isFinite(res)) {
              currentInput = res > 0 ? "Infinity" : "-Infinity";
              isSoundLocked = true;
              mathsEditSound.currentTime = 0;
              mathsEditSound.play().catch(() => {
                isSoundLocked = false;
              });
            } else {
              currentInput = (Math.round(res * 1e10) / 1e10).toString();
            }
          } else {
            currentInput = "Error";
            playFahh();
          }
        } catch (err) {
          currentInput = "Error";
          playFahh();
        }

        shouldResetDisplay = true;
        updateDisplay();
      }

      document.addEventListener("keydown", (e) => {
        let btn = findButtonByKey(e.key);
        if (btn) {
          triggerButtonVisuals(btn);
          if (isSoundLocked) return;
          btn.click();
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
